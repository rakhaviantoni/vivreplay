name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivreplay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: Quality, build, and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm run install:ci
      - name: Typecheck
        run: npm run typecheck
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Prepare local database
        run: |
          npx wrangler d1 migrations apply DB --local --config wrangler.migrations.json --persist-to .wrangler/a11y-state > /tmp/a11y-d1-migrations.log 2>&1 || {
            cat /tmp/a11y-d1-migrations.log
            exit 1
          }
      - run: npm run a11y
      - name: Save production build for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: vivreplay-worker-build
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy production Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm run install:ci
      - uses: actions/download-artifact@v4
        with:
          name: vivreplay-worker-build
          path: dist/
      - name: Check Cloudflare deployment credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Production deploy skipped. Add CLOUDFLARE_API_TOKEN (secret) and CLOUDFLARE_ACCOUNT_ID (repository variable) to enable it."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the tested build
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js deploy --config dist/server/wrangler.json --keep-vars
