name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivreplay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: Quality, build, and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm run install:ci
      - name: Typecheck
        run: npm run typecheck
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Prepare local database
        run: |
          npx wrangler d1 migrations apply DB --local --config wrangler.migrations.json --persist-to .wrangler/a11y-state > /tmp/a11y-d1-migrations.log 2>&1 || {
            cat /tmp/a11y-d1-migrations.log
            exit 1
          }
      - run: npm run a11y
