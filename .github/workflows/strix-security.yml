name: Strix Security Review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strix-security-main
  cancel-in-progress: false

jobs:
  scan:
    name: Scan trusted main branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Require the rotated DeepSeek key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Add a rotated DeepSeek key as the DEEPSEEK_API_KEY repository secret before running this scan."
            exit 1
          fi
      - name: Install Strix
        run: pipx install strix-agent
      - name: Run Strix quick scan
        env:
          STRIX_LLM: deepseek/deepseek-v4-pro
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: strix -n --target ./ --scan-mode quick --max-budget 10
      - name: Confirm the scan completed
        if: always()
        run: |
          run_json=$(find strix_runs -name run.json -type f -print 2>/dev/null | sort | tail -n 1)
          if [ -z "$run_json" ]; then
            echo "Strix did not produce a run report." >&2
            exit 1
          fi
          status=$(jq -r .status "$run_json")
          if [ "$status" != "completed" ]; then
            echo "Strix run status is '$status'; inspect its report and rerun with more budget if it stopped early." >&2
            exit 1
          fi
      - name: Save scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-security-report
          path: strix_runs/
          if-no-files-found: warn
          retention-days: 14
