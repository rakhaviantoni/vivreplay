name: Strix Security Review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strix-security-main
  cancel-in-progress: false

jobs:
  scan:
    name: Scan trusted main branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Check DeepSeek key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Add the DEEPSEEK_API_KEY repository secret before running this scan."
            exit 1
          fi
      - name: Verify DeepSeek API access
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          request = urllib.request.Request(
              "https://api.deepseek.com/chat/completions",
              data=json.dumps({
                  "model": "deepseek-flash",
                  "messages": [{"role": "user", "content": "Reply with OK."}],
                  "max_tokens": 8,
                  "stream": False,
              }).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['DEEPSEEK_API_KEY']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          started = time.monotonic()
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  if response.status != 200:
                      raise SystemExit(f"DeepSeek API returned HTTP {response.status}.")
                  json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f"DeepSeek API rejected the request (HTTP {error.code}).")
          except Exception as error:
              raise SystemExit(f"DeepSeek API check failed: {type(error).__name__}.")
          print(f"DeepSeek API check passed in {time.monotonic() - started:.1f}s.")
          PY
      - name: Install Strix
        run: pipx install strix-agent
      - name: Run Strix quick scan
        env:
          STRIX_LLM: deepseek/deepseek-flash
          LLM_API_BASE: https://api.deepseek.com
          STRIX_FORCE_API: chat_completions
          STRIX_REASONING_EFFORT: low
          LLM_PREFLIGHT_TIMEOUT: "120"
          LLM_TIMEOUT: "600"
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: strix -n --target ./ --scan-mode quick --max-budget 10
      - name: Confirm the scan completed
        if: always()
        run: |
          run_json=$(find strix_runs -name run.json -type f -print 2>/dev/null | sort | tail -n 1)
          if [ -z "$run_json" ]; then
            echo "Strix did not produce a run report." >&2
            exit 1
          fi
          status=$(jq -r .status "$run_json")
          if [ "$status" != "completed" ]; then
            echo "Strix run status is '$status'; inspect its report and rerun with more budget if it stopped early." >&2
            exit 1
          fi
      - name: Save scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-security-report
          path: strix_runs/
          if-no-files-found: warn
          retention-days: 14
